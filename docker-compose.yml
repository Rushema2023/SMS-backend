services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: stock_management
    ports:
      - "5433:5432" # exposed so DBeaver can connect from your host machine
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d stock_management"]
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://postgres:postgres@db:5432/stock_management?schema=public"
      PORT: 4000
      JWT_SECRET: "replace-this-with-a-long-random-string"
      JWT_EXPIRES_IN: "1d"
    ports:
      - "5000:4000"

volumes:
  pgdata:
